name = "cleanbrees-convoai"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CLEANBREES_API_URL = "https://cleanbrees-api.bmcii1976.workers.dev"
BREE_VOICE_ID = "pzKXffibtCDxnrVO8d1U"
BUSINESS_PHONE = "+14329997402"

[[d1_databases]]
binding = "DB"
database_name = "cleanbrees-db"
database_id = "1f72e1e8-e6aa-4ef7-a1e6-9b7c873abfe8"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "echo_metrics"

# Secrets (set via wrangler secret put):
# ELEVENLABS_API_KEY   - ElevenLabs API key for ConvoAI agent management
# TWILIO_ACCOUNT_SID   - Twilio account SID
# TWILIO_AUTH_TOKEN    - Twilio auth token (also keys X-Twilio-Signature verification)
# GOOGLE_MAPS_API_KEY  - optional, falls back to a plain Maps link if unset
# CONVOAI_AGENT_ID     - set after running POST /setup/agent
# OWNER_PHONE          - Commander's phone for emergency call forwarding
# ADMIN_API_KEY        - gates POST /setup/agent, /setup/twilio, /setup/db
# CONVOAI_WEBHOOK_SECRET - shared secret ElevenLabs echoes back on every POST /convoai/tools call;
#                          createOrUpdateAgent() refuses to publish an agent config if this is unset

# ---------------------------------------------------------------------------
# NEW Cloudflare account (af149dc6...5627, workers.dev subdomain echo-prime).
# Deploy with: npx wrangler deploy --env new
# Secrets already on the NEW worker (names only): ELEVENLABS_API_KEY, GOOGLE_MAPS_API_KEY,
# OWNER_PHONE, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN. ADMIN_API_KEY and CONVOAI_WEBHOOK_SECRET
# are intentionally unset there until provisioned through the vault, so /setup/* and
# /schedule/* fail closed (503) and /convoai/tools rejects every caller (403).
# ---------------------------------------------------------------------------
[env.new]
name = "cleanbrees-convoai"
account_id = "af149dc635e37df9b0d30d80e44e5627"
workers_dev = true
preview_urls = true

[env.new.vars]
CLEANBREES_API_URL = "https://cleanbrees-api.echo-prime.workers.dev"
BREE_VOICE_ID = "pzKXffibtCDxnrVO8d1U"
BUSINESS_PHONE = "+14329997402"

[[env.new.d1_databases]]
binding = "DB"
database_name = "cleanbrees-db"
database_id = "5b70c800-d0ea-4873-a4f8-a2b4e74a350b"
